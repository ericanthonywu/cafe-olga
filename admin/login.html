<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Cafe Olga Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
          colors: {
            brand: { 50:'#fdf8f0',100:'#f9eddc',200:'#f2d8b4',300:'#e9be84',400:'#dfa053',500:'#d78833',600:'#c87028',700:'#a65523',800:'#854522',900:'#6d3a1e' },
          },
        },
      },
    }
  </script>
  <style>
    .role-tab { transition: all 0.25s ease; }
    .role-tab.active { background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease both; }
  </style>
</head>
<body class="bg-gradient-to-br from-stone-900 via-stone-800 to-brand-900 min-h-screen flex items-center justify-center font-sans antialiased px-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500/20 border border-brand-500/30 text-brand-300 mb-4 shadow-lg">
        <i class="fa-solid fa-mug-hot text-3xl"></i>
      </div>
      <h1 class="text-3xl font-serif font-bold text-white mb-1">Cafe Olga</h1>
      <p class="text-brand-300/80 text-sm uppercase tracking-widest font-medium">Management System</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Role Switcher Tabs -->
      <div class="bg-stone-100 p-1.5 flex gap-1 m-4 rounded-xl">
        <button id="tabOwner" onclick="switchRole('owner')" class="role-tab flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg text-sm font-semibold active text-stone-800">
          <i class="fas fa-crown text-amber-500 text-xs"></i> Owner / HQ
        </button>
        <button id="tabBranch" onclick="switchRole('branch')" class="role-tab flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg text-sm font-semibold text-stone-500 hover:text-stone-700">
          <i class="fas fa-store text-xs"></i> Branch Admin
        </button>
      </div>

      <div class="px-8 pb-8 pt-2">

        <!-- Owner Login Panel -->
        <div id="ownerPanel" class="fade-in">
          <div class="flex items-center gap-2 mb-5 p-3 bg-amber-50 border border-amber-200 rounded-xl">
            <i class="fas fa-crown text-amber-500"></i>
            <div>
              <p class="text-xs font-semibold text-amber-800">Owner Access</p>
              <p class="text-xs text-amber-600">View & manage all 3 branches from one dashboard</p>
            </div>
          </div>
          <form action="owner-dashboard.html" method="GET">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-stone-700 mb-1">Email</label>
                <div class="relative">
                  <i class="fa-regular fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                  <input type="email" value="owner@cafeolga.id" class="block w-full pl-9 pr-3 py-2.5 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                <div class="relative">
                  <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                  <input type="password" value="••••••••" class="block w-full pl-9 pr-3 py-2.5 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
              </div>
              <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-crown text-sm"></i> Sign In as Owner
              </button>
            </div>
          </form>
        </div>

        <!-- Branch Admin Login Panel -->
        <div id="branchPanel" class="hidden">
          <div class="flex items-center gap-2 mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl">
            <i class="fas fa-store text-blue-500"></i>
            <div>
              <p class="text-xs font-semibold text-blue-800">Branch Admin Access</p>
              <p class="text-xs text-blue-600">Manage orders and menu for your branch</p>
            </div>
          </div>

          <!-- Branch Selector -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-stone-700 mb-2">Select Branch</label>
            <div class="grid grid-cols-3 gap-2" id="branchSelector">
              <button type="button" onclick="selectBranch('sudirman', this)" class="branch-btn p-2.5 rounded-xl border-2 border-brand-500 bg-brand-50 text-center cursor-pointer transition-all">
                <i class="fas fa-building text-brand-600 text-sm block mb-1"></i>
                <span class="text-xs font-semibold text-brand-800">Sudirman</span>
              </button>
              <button type="button" onclick="selectBranch('kemang', this)" class="branch-btn p-2.5 rounded-xl border-2 border-stone-200 bg-white text-center cursor-pointer transition-all hover:border-stone-300">
                <i class="fas fa-tree text-emerald-600 text-sm block mb-1"></i>
                <span class="text-xs font-semibold text-stone-600">Kemang</span>
              </button>
              <button type="button" onclick="selectBranch('bsd', this)" class="branch-btn p-2.5 rounded-xl border-2 border-stone-200 bg-white text-center cursor-pointer transition-all hover:border-stone-300">
                <i class="fas fa-city text-indigo-600 text-sm block mb-1"></i>
                <span class="text-xs font-semibold text-stone-600">BSD City</span>
              </button>
            </div>
            <!-- Branch credential hint -->
            <div id="branchHint" class="mt-2 p-2 bg-stone-50 rounded-lg border border-stone-100">
              <p class="text-xs text-stone-500">Credential: <span class="font-mono text-stone-700" id="branchEmail">admin.sudirman@cafeolga.id</span></p>
            </div>
          </div>

          <form action="dashboard.html" method="GET">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-stone-700 mb-1">Email</label>
                <div class="relative">
                  <i class="fa-regular fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                  <input type="email" id="branchEmailInput" value="admin.sudirman@cafeolga.id" class="block w-full pl-9 pr-3 py-2.5 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-stone-700 mb-1">Password</label>
                <div class="relative">
                  <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                  <input type="password" value="••••••••" class="block w-full pl-9 pr-3 py-2.5 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
              </div>
              <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-store text-sm"></i> Sign In to Branch
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-stone-500/60 text-xs mt-6">© 2026 Cafe Olga Management System</p>
  </div>

  <script>
    const branchEmails = {
      sudirman: 'admin.sudirman@cafeolga.id',
      kemang:   'admin.kemang@cafeolga.id',
      bsd:      'admin.bsd@cafeolga.id',
    };
    let currentBranch = 'sudirman';

    function switchRole(role) {
      const ownerPanel = document.getElementById('ownerPanel');
      const branchPanel = document.getElementById('branchPanel');
      const tabOwner = document.getElementById('tabOwner');
      const tabBranch = document.getElementById('tabBranch');

      if (role === 'owner') {
        ownerPanel.classList.remove('hidden');
        ownerPanel.classList.add('fade-in');
        branchPanel.classList.add('hidden');
        tabOwner.classList.add('active');
        tabOwner.classList.remove('text-stone-500');
        tabOwner.classList.add('text-stone-800');
        tabBranch.classList.remove('active');
        tabBranch.classList.add('text-stone-500');
        tabBranch.classList.remove('text-stone-800');
      } else {
        branchPanel.classList.remove('hidden');
        branchPanel.classList.add('fade-in');
        ownerPanel.classList.add('hidden');
        tabBranch.classList.add('active');
        tabBranch.classList.remove('text-stone-500');
        tabBranch.classList.add('text-stone-800');
        tabOwner.classList.remove('active');
        tabOwner.classList.add('text-stone-500');
        tabOwner.classList.remove('text-stone-800');
      }
    }

    function selectBranch(branch, btn) {
      currentBranch = branch;
      // Reset all buttons
      document.querySelectorAll('.branch-btn').forEach(b => {
        b.className = 'branch-btn p-2.5 rounded-xl border-2 border-stone-200 bg-white text-center cursor-pointer transition-all hover:border-stone-300';
      });
      // Highlight selected
      btn.className = 'branch-btn p-2.5 rounded-xl border-2 border-brand-500 bg-brand-50 text-center cursor-pointer transition-all';
      const email = branchEmails[branch];
      document.getElementById('branchEmail').textContent = email;
      document.getElementById('branchEmailInput').value = email;
    }
  </script>
</body>
</html>
